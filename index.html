<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="陕西美食小站：肉夹馍、羊肉泡馍、biangbiang 面、凉皮、臊子面……用一张网页认识三秦大地的味道。">
  <meta name="theme-color" content="#FF6B35">
  <title>陕西美食 · 三秦味道</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- 无障碍：键盘用户可直接跳到正文 -->
  <a class="skip-link" href="#main">跳到主要内容</a>

  <!-- ================= 顶部导航 ================= -->
  <header class="site-header">
    <div class="wrap header-inner">
      <a class="brand" href="#top">
        <span class="brand-mark">陕</span>
        <span class="brand-text">三秦味道<small>SHAANXI FOOD</small></span>
      </a>
      <nav class="site-nav" aria-label="主导航">
        <a href="#foods" data-nav="foods">美食</a>
        <a href="#culture" data-nav="culture">文化</a>
        <a href="#plan" data-nav="plan">一日食单</a>
      </nav>
      <a class="header-cta" href="#foods">开吃 →</a>
    </div>
  </header>

  <main id="main">

    <!-- ================= 首屏 ================= -->
    <section class="hero" id="top">
      <div class="blob blob-1" aria-hidden="true"></div>
      <div class="blob blob-2" aria-hidden="true"></div>
      <div class="blob blob-3" aria-hidden="true"></div>

      <div class="wrap hero-inner">
        <div class="hero-copy">
          <p class="pill-tag">🔥 西安 · 碳水天堂</p>
          <h1>一碗面，<br><span class="hl">半部中国史</span></h1>
          <p class="hero-lead">
            从西安的肉夹馍到岐山的臊子面，陕西人把三千年的面食智慧，
            都揉进了一日三餐。这里没有精致的摆盘，只有结结实实的香。
          </p>
          <div class="hero-actions">
            <a class="btn btn-primary" href="#foods">看看吃什么</a>
            <a class="btn btn-ghost" href="#culture">了解面食文化</a>
          </div>
          <ul class="hero-tags" aria-label="关键词">
            <li>手工现做</li>
            <li>辣子管够</li>
            <li>人均 ¥20</li>
          </ul>
        </div>

        <div class="hero-art" aria-hidden="true">
          <div class="art-card art-1"><span>🥙</span><b>肉夹馍</b></div>
          <div class="art-card art-2"><span>🍜</span><b>biangbiang 面</b></div>
          <div class="art-card art-3"><span>🥤</span><b>冰峰</b></div>
          <div class="art-sticker">碳水<br>快乐</div>
        </div>
      </div>
    </section>

  </main>

  <script src="js/main.js" defer></script>
</body>
</html>
